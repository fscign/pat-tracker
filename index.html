<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#eef2f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b141b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="icon-192.png">

<style>
:root{
  /* Layout idea: one phone-width column, scoreboard numerals, tournament-blue cloth as the only strong colour */
  --bg:#eef2f5; --surface:#ffffff; --ink:#10212f; --muted:#5a6b79; --line:#d7dfe6;
  --accent:#0b6aa8; --accent-ink:#ffffff; --good:#1a8552; --warn:#a8700a; --bad:#c23b32;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b141b; --surface:#13202b; --ink:#e8eff4; --muted:#8fa2b1; --line:#24384a;
  --accent:#5db4e6; --accent-ink:#06202f; --good:#47c284; --warn:#e5ad3d; --bad:#f0756b; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0b141b; --surface:#13202b; --ink:#e8eff4; --muted:#8fa2b1; --line:#24384a;
  --accent:#5db4e6; --accent-ink:#06202f; --good:#47c284; --warn:#e5ad3d; --bad:#f0756b; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0}
html{touch-action:manipulation}
button,input,a,label{touch-action:manipulation}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom));position:relative}
main{display:flex;flex-direction:column;gap:18px;padding:4px 16px 24px}
section{display:flex;flex-direction:column;gap:10px}
h1,h2,h3,p{margin:0}
h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.01em;line-height:1.1;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h3{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num,.big{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700}
.good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)} .dim{color:var(--muted)}
.fine{font-size:13.5px;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));background:var(--bg)}
.top h1{flex:1;min-width:0}
.top:not(.home) h1{font-size:23px}
.top.home{align-items:flex-start;padding-top:calc(22px + env(safe-area-inset-top))}
.top.home>div{flex:1}
.top .sub{color:var(--muted);font-size:14px;margin-top:2px}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:26px;line-height:1;padding:0 0 4px}
.step{font-family:var(--display);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.sync{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;margin-top:4px}
.sync{background:var(--surface);font-weight:600;color:var(--accent);padding:7px 14px;font-size:13px}
.file-btn{display:flex;align-items:center;justify-content:center;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.test-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.test-head h3{font-size:26px}
.test-head p{color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0}
.stats div{border-left:2px solid var(--line);padding-left:8px}
.stats dt{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:0;font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;padding:10px 16px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)} .btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0;text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 14px;min-height:60px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-main b{font-weight:600}
.row-main small{color:var(--muted);font-size:13px}
.row .num{font-size:24px}
.chev{color:var(--muted);font-size:22px}
.idx{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;border:1.5px solid var(--line);color:var(--muted);flex:none}
.idx.part{border-color:var(--warn);color:var(--warn)}
.idx.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;border:1px solid var(--line);border-radius:6px;padding:3px 7px;white-space:nowrap;flex:none}
.hero-num{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big{font-size:64px;line-height:.95}
.of{color:var(--muted);font-size:14px}
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.04em}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog div{height:100%;background:var(--accent)}
.hero-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.date input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-left:6px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:13px;font-weight:600;border:1px solid currentColor;border-radius:999px;padding:3px 10px;color:var(--muted)}
.pill.good{color:var(--good)} .pill.bad{color:var(--bad)} .pill.warn{color:var(--warn)}
.seg{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;font-family:var(--display);font-weight:600;font-size:17px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button.filled:not(.on){color:var(--good)}
.part-title{font-size:22px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:700}
.fig{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center}
.table{width:100%;max-width:330px;height:auto;display:block;filter:drop-shadow(0 8px 14px rgba(8,20,30,.28))}
.dg-rail{font:600 10px var(--body);fill:#e8eef3;fill-opacity:.7;letter-spacing:.18em;text-anchor:middle}
.dg-zone{font:600 13px var(--body);fill:#fff;text-anchor:middle}
.dg-note{font:italic 500 12.5px var(--body);fill:#fff;text-anchor:middle}
.dg-note.sm{font-size:10.5px;paint-order:stroke;stroke:#2f86bd;stroke-width:4px}
.dg-num{font:700 12.5px var(--display);text-anchor:middle}
.fig figcaption{width:100%;max-width:330px;display:flex;justify-content:flex-end;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lg{display:inline-block;width:18px;height:0;border-top:3px solid #d9a521}
.lg.cb{border-top:2px dashed var(--muted);margin-left:6px}
.missing{background:var(--surface);border:1px dashed var(--warn);border-radius:12px;padding:14px;font-size:14.5px}
.how ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:15px}
.tiprow{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
.tip{width:40px;height:40px;flex:none}
.field{display:flex;flex-direction:column;gap:6px}
.flabel{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.chip{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-family:var(--display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;padding:0}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sum-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sum-top>div:first-child{display:flex;align-items:baseline;gap:8px}
.sum-side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:14px;color:var(--muted)}
.sum-side b{color:var(--ink);font-family:var(--display);font-size:18px}
.meter{position:relative;height:12px;border-radius:99px;background:var(--line)}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:currentColor}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.meter-lab{position:relative;display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);height:16px}
.meter-lab .abs{position:absolute;transform:translateX(-50%);color:var(--ink);font-weight:600}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;resize:vertical}
.pager{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:1fr 1.2fr 1.4fr;gap:8px;max-width:480px;margin:0 auto;padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(3,1fr);max-width:480px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{border:0;background:none;min-height:58px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-top:3px solid transparent}
.tabs button.on{color:var(--accent);border-top-color:var(--accent)}
.bars{display:flex;flex-direction:column;gap:4px}
.bar{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:baseline;background:none;border:0;text-align:left;padding:7px 0;width:100%}
.bar-name{font-size:14.5px}
.bar-val{font-size:20px;display:flex;align-items:baseline;gap:6px}
.bar-val small{font-family:var(--body);font-size:12px;font-weight:600}
.up{color:var(--good)} .down{color:var(--bad)}
.track{grid-column:1/-1;position:relative;height:10px}
.track .cap{position:absolute;inset:0 auto 0 0;background:var(--line);border-radius:99px}
.track .fill{position:absolute;inset:0 auto 0 0;background:currentColor;border-radius:99px}
.track .tick{top:-3px;bottom:-3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rank{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.rank li{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:14.5px}
.rank li span{display:flex;flex-direction:column}
.rank small{color:var(--muted);font-size:12.5px}
.rank b{font-size:20px}
.emb-track{position:relative;height:10px;border-radius:99px;background:var(--line);margin:6px 0 22px}
.emb-fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.emb-track i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--muted)}
.emb-track i.hit{background:var(--good)}
.emb-track i b{position:absolute;top:16px;left:50%;transform:translateX(-50%);font:600 11.5px var(--body);color:var(--muted);font-style:normal}
.tbl{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:1fr 44px 44px 66px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.tr.th{border-top:0;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:0}
.tr .num{font-size:19px;text-align:right}
.tr.th span:nth-child(2),.tr.th span:nth-child(3){text-align:right}
.trend{width:100%;height:auto}
.ax{font:500 11px var(--body);fill:var(--muted)}
.ax.strong{font:700 14px var(--display);fill:var(--ink)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted)}
.noteline{font-size:14.5px}
.noteline b{display:block;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(4,12,18,.55);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:480px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;padding:20px 16px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap}
@media (max-width:360px){ .big{font-size:54px} .stats{grid-template-columns:repeat(2,1fr)} .two{grid-template-columns:1fr} }
.duo{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}
.duo>div{display:flex;flex-direction:column}
.big.sm{font-size:40px;line-height:1}
.unit{font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);margin:0 6px 0 2px}
.photo{width:100%;max-width:420px;height:auto;border-radius:12px;display:block;border:1px solid var(--line)}
.counter{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cbtn{width:56px;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:30px;line-height:1;font-weight:600;padding:0}
.cbtn:disabled{opacity:.35}
.cval{font-size:40px;min-width:48px;text-align:center}
.zero{min-height:44px}
.clear{margin-left:auto}
.timer .t-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.timer .t-row>div:first-child{display:flex;flex-direction:column}
.t-btns .btn{min-width:110px}
.tman{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:90px;font-variant-numeric:tabular-nums}
.racks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rk{display:flex;flex-direction:column;align-items:center;border-radius:10px;padding:6px 0;font-family:var(--display);font-weight:700;font-size:22px;border:1px solid var(--line)}
.rk small{font-family:var(--body);font-size:10.5px;font-weight:600;color:var(--muted)}
.rk.r15{background:var(--good);border-color:var(--good);color:#fff}
.rk.r15 small{color:#fff}
.rk.r10{border-color:var(--good);color:var(--good)}
.rk.re{color:var(--muted)}
.row.plain{border:0;padding:0;min-height:0;background:none}
.entry-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.entry-head .sum-side{font-size:13.5px}
.sum-row{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.sum-row>div:first-child{display:flex;align-items:baseline;gap:8px}
.photo{aspect-ratio:3/4;object-fit:cover}
.cbtn{font-family:var(--body)}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.form{display:flex;flex-direction:column;gap:6px}
.form label{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:6px}
.form input{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.form .btn{margin-top:10px}
.inrow{display:flex;gap:8px}
.inrow .btn{margin-top:0}
.err{color:var(--bad);font-size:14px;font-weight:600}
.okmsg{color:var(--good);font-size:14px;font-weight:600}
.shared-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.shared-list li{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:6px}
.link.danger{color:var(--bad)}
.sheet{max-height:92vh;overflow:auto}
.vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.vv{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 4px}
.vv small{font-size:11px;color:var(--muted);text-align:center}
.vv b{font-size:20px}
.shared-cat .entry-head{align-items:center}
.tpair{display:flex;align-items:center;gap:6px}
.tpair .tman{width:58px;text-align:center}
.pic{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block;-webkit-touch-callout:default}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-ink)}
.figbtn{display:block;width:100%;max-width:330px;border:0;background:none;padding:0;position:relative;cursor:zoom-in}
.figbtn .table{max-width:none}
.zoomhint{position:absolute;right:8px;bottom:8px;font-size:11.5px;font-weight:600;color:#fff;background:rgba(5,15,22,.6);padding:3px 8px;border-radius:99px}
.zoomwrap{position:fixed;inset:0;z-index:40;background:#05090c;display:flex;flex-direction:column}
.zoombar{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;color:#e8eef3}
.zoombar .zk{flex:1;text-align:center;font-family:var(--display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.zb{width:48px;height:48px;border-radius:12px;border:1px solid #2a3a48;background:#13202b;color:#e8eef3;font-size:26px;line-height:1;padding:0}
.zb:disabled{opacity:.35}
.zoombody{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;-webkit-overflow-scrolling:touch;padding:8px 8px calc(16px + env(safe-area-inset-bottom));touch-action:pan-x pan-y pinch-zoom}
.zoomin{margin:0 auto;width:100%;max-width:calc((100vh - 90px) * 0.555)}
.zoomin .table{width:100%;height:auto;max-width:none;display:block;filter:none}
@media (min-aspect-ratio:1/1){ .zoomin{width:auto} }
.homefoot{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0 6px;color:var(--muted);font-size:14px;text-align:center}
.kofi{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px}
.kofi-btn{background:#ff5e5b;border-color:#ff5e5b;color:#fff!important;text-decoration:none}
.sync.info{width:34px;padding:0;font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:16px}
</style>

<body>
<div id="app"></div>
<script src="firebase-config.js"></script>
<script>
/* ---------- Table geometry helpers (book coordinates: x 0..8 foot to head, y 0..4) ---------- */
const F = 0.09, HB = 0.18, W1 = 0.27; // ball = 0.18 diamond (2.25in ball, 12.5in diamond)
const BW = 0.18, bw = n => F + n*BW; // centre of the (n+1)th ball out from a rail
const AIM = { TL:[.07,.07], BL:[.07,3.93], TR:[7.93,.07], BR:[7.93,3.93], TS:[4,.03], BS:[4,3.97] };
const ob = (x,y,n) => ({ p:[x,y], n });
const cue = (x,y) => ({ p:[x,y], t:'cue' });
const gh = (x,y) => ({ p:[x,y], t:'ghost' });
const pot = (b,pk) => ({ pts:[b,AIM[pk]], k:'ob', arrow:1 });
const aimL = (c,b) => ({ pts:[c,b], k:'aim' });
const path = (pts) => ({ pts, k:'cue', arrow:1 });
const rect = (x1,y1,x2,y2,label,lp) => ({ poly:[[x1,y1],[x2,y1],[x2,y2],[x1,y2]], label, lp: lp || [(x1+x2)/2,(y1+y2)/2] });
function behind(b,pk,x){ const a=AIM[pk]; const t=(x-a[0])/(b[0]-a[0]); return [x, a[1]+t*(b[1]-a[1])]; }
function straightSet(objs,pk,xLine,nums){
  const balls=[], lines=[];
  objs.forEach((o,i)=>{ const c=behind(o,pk,xLine); balls.push(ob(o[0],o[1],nums?nums[i]:undefined)); balls.push(gh(c[0],c[1])); lines.push(aimL(c,o)); lines.push(pot(o,pk)); });
  return { balls, lines };
}
const col = (x,y0,step,n) => Array.from({length:n},(_,i)=>[x, +(y0+i*step).toFixed(3)]);

    avg = sum/div;
    if(kind==='pat') pts=Math.round(avg*cat.factor);
    else if(kind==='pct') pts=Math.round(avg/cat.cap*100);
    else if(kind==='lower') pts=Math.round(cat.best/avg*100);

  const cats=test.cats.map(c=>({ cat:c, ...catCalc(c,scores) }));

  const sum=done.reduce((s,c)=>s+c.pts,0);
  const total = test.mode==='sum' ? sum : (done.length ? Math.round(sum/done.length) : 0);

/* ---------- Backup and restore (scores live on this phone) ---------- */
function backupJSON(){ return JSON.stringify({ app:'pat-tracker', v:1, exported:new Date().toISOString(), sessions:S.sessions.filter(hasData).map(s=>{ const c=Object.assign({},s); if(c.timer){ c.times=Object.assign({},c.times); c.times[c.timer.cat]=Math.round(tOf(s,c.timer.cat)); delete c.timer; } return c; }) }); }
function cleanSession(r){
  if(!r||typeof r.id!=='string'||typeof r.test!=='string'||!testById(r.test)) return null;
  const scores={}; Object.keys(r.scores||{}).forEach(k=>{ const v=r.scores[k]; if(typeof v==='number'&&isFinite(v)) scores[k]=v; });
  const notes={}; Object.keys(r.notes||{}).forEach(k=>{ if(typeof r.notes[k]==='string') notes[k]=r.notes[k].slice(0,2000); });
  const times={}; Object.keys(r.times||{}).forEach(k=>{ const v=r.times[k]; if(typeof v==='number'&&isFinite(v)&&v>=0) times[k]=Math.round(v); });
  const sharedWith=Array.isArray(r.sharedWith)?r.sharedWith.filter(x=>typeof x==='string').slice(0,50):[]; const sharedNames={}; sharedWith.forEach(u=>{ if(r.sharedNames&&typeof r.sharedNames[u]==='string') sharedNames[u]=r.sharedNames[u].slice(0,40); });
  return { id:r.id.slice(0,40), test:r.test, times, sharedWith, sharedNames, date:/^\d{4}-\d{2}-\d{2}$/.test(r.date)?r.date:today(), created:+r.created||Date.now(), updatedAt:+r.updatedAt||0, scores, notes, finished:!!r.finished };
}
function mergeBackup(text){
  let d; try{ d=JSON.parse(text); }catch(e){ return { error:'That file is not a Pool Progress backup.' }; }
  if(!d||d.app!=='pat-tracker'||!Array.isArray(d.sessions)) return { error:'That file is not a Pool Progress backup.' };
  let added=0, updated=0;
  d.sessions.forEach(r=>{ const c=cleanSession(r); if(!c) return; const l=sess(c.id);
    if(!l){ S.sessions.push(c); S.tomb=S.tomb.filter(t=>t!==c.id); added++; }
    else if(c.updatedAt>l.updatedAt){ Object.assign(l,c); updated++; } });
  persist(); return { added, updated };
}
async function saveBackup(){
  const name='pool-progress-backup-'+today()+'.json', text=backupJSON();
  const file=new File([text], name, { type:'application/json' });
  try{ if(navigator.canShare&&navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:'Pool Progress backup' }); markBackup(); return; } }
  catch(e){ if(e&&e.name==='AbortError') return; }
  try{ const url=URL.createObjectURL(file), a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); markBackup(); toast('Backup file saved'); }
  catch(e){ toast('Could not save the file'); }
}
function markBackup(){ S.prefs.lastBackup=today(); persist(); }

/* ---------- Small charts ---------- */
function spark(vals,w,h){
  if(vals.length<2) return '';
  const mn=Math.min(...vals), mx=Math.max(...vals), sp=(mx-mn)||1;
  const P=vals.map((v,i)=>[3+i*(w-6)/(vals.length-1), h-4-(v-mn)/sp*(h-8)]);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${P[P.length-1][0].toFixed(1)}" cy="${P[P.length-1][1].toFixed(1)}" r="2.8" fill="var(--accent)"/></svg>`;
}
function trendChart(points, target, unit){
  const W=340,H=170,L=38,Rr=12,Tp=14,B=26;
  const vals=points.map(p=>p.v), lo=Math.min(...vals,target==null?vals[0]:target), hi=Math.max(...vals,target==null?vals[0]:target);
  const step=hi<=20?2:10, pad=Math.max(step,(hi-lo)*.15), mn=Math.max(0,Math.floor((lo-pad)/step)*step), mx=Math.ceil((hi+pad)/step)*step;
  const X=i=>points.length===1?(L+(W-L-Rr)/2):L+i*(W-L-Rr)/(points.length-1), Y=v=>Tp+(1-(v-mn)/(mx-mn))*(H-Tp-B);
  let o='';
  [mn,(mn+mx)/2,mx].forEach(v=>{ o+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" class="ax">${Math.round(v)}</text>`; });
  if(target!=null) o+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--good)" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${L+4}" y="${Y(target)-5}" class="ax" fill="var(--good)">target ${target}${unit}</text>`;
  const P=points.map((p,i)=>[X(i),Y(p.v)]);
  if(P.length>1){ o+=`<polygon points="${L},${H-B} ${P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')} ${P[P.length-1][0].toFixed(1)},${H-B}" fill="var(--accent)" fill-opacity=".12"/><polyline points="${P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`; }
  P.forEach((p,i)=>{ const last=i===P.length-1; o+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${last?4.5:3}" fill="${last?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`; });
  const lastP=P[P.length-1]; o+=`<text x="${Math.min(lastP[0],W-Rr-4).toFixed(1)}" y="${(lastP[1]-10).toFixed(1)}" text-anchor="end" class="ax strong">${points[points.length-1].v}</text>`;
  o+=`<text x="${L}" y="${H-7}" class="ax">${esc(points[0].label)}</text>`;
  if(points.length>1) o+=`<text x="${W-Rr}" y="${H-7}" text-anchor="end" class="ax">${esc(points[points.length-1].label)}</text>`;
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Score trend">${o}</svg>`;
}

  if(cat.timed){ const on=s.timer&&s.timer.cat===cat.id, tm=tOf(s,cat.id);
    const mm=tm&&!on?Math.floor(Math.round(tm)/60):'', ss=tm&&!on?Math.round(tm)%60:'';
    h+=`<section class="card timer"><div class="t-row"><div><span class="flabel">Time</span><span class="big sm num" id="tval" data-cat="${cat.id}">${fmtT(tm)}</span></div><div class="t-btns">${on?`<button class="btn danger-solid" data-act="t-stop">Stop</button>`:`<button class="btn primary" data-act="t-start">${tm?'Resume':'Start'}</button>`}</div></div><div class="t-row"><span class="fine">Or type it</span><div class="tpair"><input id="tmin" class="tman" data-chg="tmm" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="8" value="${mm}" aria-label="Minutes"${on?' disabled':''}><span class="fine">min</span><input id="tsec" class="tman" data-chg="tmm" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="43" value="${ss}" aria-label="Seconds"${on?' disabled':''}><span class="fine">sec</span></div>${tm&&!on?'<button class="link" data-act="t-reset">Reset</button>':''}</div><p class="fine">The clock stops by itself when you leave this drill.</p></section>`; }
  // live summary
  const prev=sorted(t.id).filter(x=>x.id!==s.id).map(x=>catCalc(cat,x.scores)).filter(x=>x.complete).map(x=>x.pts);
  const lower=kind==='errors', best=prev.length?(lower?Math.min(...prev):Math.max(...prev)):null, last=prev.length?prev[prev.length-1]:null;
  let avgTxt='', scale='';
  if(c.entered){
    if(kind==='pat'){ avgTxt=`average ${c.avg.toFixed(2)} against a target of ${cat.target}`; const sm=Math.max(c.max,100); scale=`<div class="meter"><div class="fill ${band(t,c.pts)}" style="width:${Math.min(100,c.pts/sm*100)}%"></div><i class="tick" style="left:${100/sm*100}%"></i></div><div class="meter-lab"><span>0</span><span style="left:${100/sm*100}%" class="abs">target 100</span><span>max ${c.max}</span></div>`; }
    else if(kind==='pct') avgTxt=`average ${c.avg.toFixed(2)} of ${cat.cap}`;
    else if(kind==='lower') avgTxt=`average ${c.avg.toFixed(1)} innings`;
    else if(kind==='errors') avgTxt=c.n>1?`${c.sum} errors in total`:'';
    else if(kind==='ghost'){ const v=part.fields.map((f,i)=>s.scores[cat.id+'.a.'+i]).filter(x=>typeof x==='number'); avgTxt=`average ${c.avg.toFixed(1)} per rack, ${v.filter(x=>x===15).length} break and runs`; scale=`<div class="meter"><div class="fill ${c.complete?bandK(t,cat,c.pts):''}" style="width:${Math.min(100,c.pts/150*100)}%"></div></div><div class="meter-lab"><span>0</span><span>150</span></div>`; }
    else avgTxt=`${c.sum} of ${c.complete?cat.cap:c.entered*7} so far`;
  }
  const hist=best!=null?`<span>${lower?'Fewest':'Best'} <b>${best}</b></span><span>Last <b>${last}</b></span>`:'<span>First time on this drill</span>';
  const isNew=c.complete&&best!=null&&(lower?c.pts<best:c.pts>best)?'<span class="pill good">New best</span>':'';
  const fieldsHtml=part.fields.map((f,i)=>{ const key=cat.id+'.'+part.id+'.'+i; return `<div class="field"><span class="flabel">${f.label}</span>${chips(key,f,s.scores[key])}</div>`; }).join('');
  const showTotal=!(kind==='errors'&&c.n===1);
  const hint=`<p class="fine">${kind==='errors'?'Use + and − to count your errors as you play.':'Tap a number for each line. Tap it again to clear it.'}</p>`;
  h+=`<section class="card entry"><div class="entry-head"><h3>${kind==='errors'?'Your errors':'Your score'}</h3><div class="sum-side">${hist}${isNew}</div></div>${hint}${fieldsHtml}${showTotal?`<div class="sum-row"><div><span class="big ${c.complete?bandK(t,cat,c.pts):''}">${c.entered?c.pts:'&middot;'}</span><span class="of">${kind==='pat'||kind==='ghost'?'points':kind==='errors'?(c.pts===1?'error in total':'errors in total'):'percent'}${c.entered&&!c.complete?' so far':''}</span></div>${avgTxt&&kind!=='errors'?`<p class="fine">${c.entered} of ${c.n} entered, ${avgTxt}.</p>`:''}${scale}</div>`:''}</section>`;
  h+=`<section class="card"><label class="flabel" for="note">Notes for this drill</label><textarea id="note" data-inp="note" rows="2" placeholder="${kind==='errors'?'What caused the errors?':'What cost you points?'}">${esc(s.notes[cat.id]||'')}</textarea></section>`;
  const lastPart=pi===cat.parts.length-1, lastCat=ci===t.cats.length-1;
  h+=`</main><footer class="pager"><button class="btn ghost" data-act="prev"${ci===0&&pi===0?' disabled':''}>Back</button><button class="btn ghost" data-act="list">All drills</button><button class="btn primary" data-act="next">${lastPart&&lastCat?'Result':'Next'}</button></footer>`;
  return h;
}

function vResult(){

  if(notes.length) h+=`<section class="card"><h3>Your notes</h3>${notes.map(k=>`<p class="noteline"><b>${k.name}</b> ${esc(s.notes[k.id])}</p>`).join('')}</section>`;

function vResultBasis(s,t,c){

  if(c.complete&&prev){ const de=c.errors-prev.errors, dg=c.total-prev.total; h+=`<span class="pill ${de<=0?'good':'bad'}">${de>0?'+':''}${de} errors vs previous</span><span class="pill ${dg>=0?'good':'bad'}">${dg>0?'+':''}${dg} ghost vs previous</span>`; }

function vInsights(){
  const tid=S.view.test||(sorted().length?sorted()[sorted().length-1].test:'pat2'), t=testById(tid);
  const done=completeOf(tid), any=sorted(tid);
  let h=topBar('Insights')+`<main><div class="seg">${TESTS.map(x=>`<button class="${x.id===tid?'on':''}" data-act="instest" data-test="${x.id}">${x.short||x.name}</button>`).join('')}</div>`;

function insightsBasis(t,done,any){
  let h='';
  if(done.length){ const cs=done.map(s=>({ c:calcOf(s), label:fmtDate(s.date) }));
    const g=cs.map(x=>({ v:x.c.total, label:x.label })), e=cs.map(x=>({ v:x.c.errors, label:x.label }));
    const gv=g.map(p=>p.v), ev=e.map(p=>p.v), avg=a=>Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10;
    h+=`<section class="card"><h3>Errors, drills 1 to 6</h3><p class="fine">Lower is better.</p>${trendChart(e,null,'')}<dl class="stats"><div><dt>Tests</dt><dd>${ev.length}</dd></div><div><dt>Fewest</dt><dd>${Math.min(...ev)}</dd></div><div><dt>Average</dt><dd>${avg(ev)}</dd></div><div><dt>Last</dt><dd>${ev[ev.length-1]}</dd></div></dl></section>`;
    h+=`<section class="card"><h3>Ghost 9-Ball</h3>${trendChart(g,null,'')}<dl class="stats"><div><dt>Tests</dt><dd>${gv.length}</dd></div><div><dt>Best</dt><dd>${Math.max(...gv)}</dd></div><div><dt>Average</dt><dd>${avg(gv)}</dd></div><div><dt>Last</dt><dd>${gv[gv.length-1]}</dd></div></dl></section>`;
  } else h+=`<p class="empty">Finish all ${t.cats.length} parts in one sitting to start the trend charts. Drill figures below already count.</p>`;
  const rows=t.cats.map((cat,i)=>{ const v=any.map(s=>catCalc(cat,s.scores)).filter(x=>x.complete).map(x=>x.pts), l3=v.slice(-3), low=cat.kind==='errors';
    return { cat, i, v, best:v.length?(low?Math.min(...v):Math.max(...v)):null, last:v.length?v[v.length-1]:null, recent:l3.length?Math.round(l3.reduce((a,b)=>a+b,0)/l3.length*10)/10:null }; });
  const worst=rows.filter(r=>r.cat.kind==='errors'&&r.recent>0).sort((a,b)=>b.recent-a.recent);
  if(worst.length) h+=`<section class="card"><h3>Practise next</h3><p class="fine">Most errors on average over your last three attempts at each drill.</p><ol class="rank">${worst.slice(0,3).map(r=>`<li><span>${r.cat.name}</span><b class="num ${bandK(t,r.cat,Math.round(r.recent))}">${r.recent}</b></li>`).join('')}</ol></section>`;
  h+=`<section class="card"><h3>Every drill</h3><div class="tbl"><div class="tr th"><span>Drill</span><span>Last</span><span>Best</span><span>Trend</span></div>${rows.map(r=>`<div class="tr"><span>${r.i+1}. ${r.cat.name}</span><span class="num ${r.last!=null?bandK(t,r.cat,r.last):'dim'}">${r.last==null?'&middot;':r.last}</span><span class="num">${r.best==null?'&middot;':r.best}</span><span>${spark(r.v.slice(-8),64,22)}</span></div>`).join('')}</div><p class="fine">Best means fewest errors for drills 1 to 6.</p></section>`;
  return h;
}
function vZoom(){ const z=S.zoom;
  return `<div class="zoomwrap" role="dialog" aria-modal="true" aria-label="Diagram full screen"><div class="zoombar"><button class="zb" data-act="zclose" aria-label="Close">&times;</button></div><div class="zoombody"><div class="zoomin">${drawDiagram(z.id,S.prefs.mirror)}</div></div></div>`;
}
function vSheet(){ const sh=S.sheet;
  if(sh.kind==='about') return `<div class="scrim" data-act="cancel"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="About"><h3>Pool Progress</h3><p>A free app for scoring pool practice tests and tracking your progress. Made by Aleksandrs Horsuns, a pool player from Latvia.</p><p class="fine">Your scores stay on your phone unless you sign in. Use Backup on the main screen to keep a copy.</p><p>If the app helps your game, you can buy me a coffee.</p><div class="actions"><a class="btn kofi-btn file-btn" href="${'https://ko-fi.com/ahorsun'}" target="_blank" rel="noopener">&#9749; Support on Ko-fi</a><button class="btn ghost" data-act="cancel">Close</button></div></div>`;
  if(sh.kind==='account'){
    const u=me(), mode=u?'profile':(sh.mode||'signin'), busy=sh.busy?' disabled':'', err=sh.err?`<p class="err" role="alert">${esc(sh.err)}</p>`:'', ok=sh.ok?`<p class="okmsg">${esc(sh.ok)}</p>`:'';
    let b='';
    if(mode==='profile'){ const n=S.sessions.filter(hasData).length;
      b=`<h3>${esc(u.name||u.nick||'Your account')}</h3><p class="fine">${esc(u.nick)} · ${esc(u.email)}</p><form class="form" data-form="setname"><label for="f-name">Your name (shown to people you share with)</label><div class="inrow"><input id="f-name" value="${esc(u.name||'')}" autocomplete="name" maxlength="60" placeholder="e.g. Aleksandrs Horsuns"><button class="btn"${busy}>Save</button></div>${ok}${err}</form><p>Your ${n} test${n===1?' is':'s are'} saved to your account. Others can share tests with you using your email or your nickname.</p><p class="fine" id="netstate">${netText()}</p><div class="actions"><button class="btn" data-act="signout"${busy}>Sign out</button><button class="btn ghost" data-act="cancel">Close</button></div>`; }
    else if(mode==='signup') b=`<h3>Create account</h3><form class="form" data-form="signup"><label for="f-nick">Nickname</label><input id="f-nick" value="${esc((sh.vals||{})["f-nick"]||"")}" autocomplete="username" autocapitalize="off" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_.\\-]{3,20}"><label for="f-name">Your name (shown to people you share with)</label><input id="f-name" value="${esc((sh.vals||{})["f-name"]||"")}" autocomplete="name" maxlength="60" placeholder="Optional"><label for="f-email">Email</label><input id="f-email" value="${esc((sh.vals||{})["f-email"]||"")}" type="email" autocomplete="email" required><label for="f-pass">Password</label><input id="f-pass" value="${esc((sh.vals||{})["f-pass"]||"")}" type="password" autocomplete="new-password" required minlength="6">${err}<button class="btn primary"${busy}>Create account</button></form><p class="fine">Already have an account? <button class="link" data-act="amode" data-mode="signin">Sign in</button></p>`;
    else if(mode==='reset') b=`<h3>Reset password</h3><form class="form" data-form="reset"><label for="f-email">Email</label><input id="f-email" value="${esc((sh.vals||{})["f-email"]||"")}" type="email" autocomplete="email" required>${err}${ok}<button class="btn primary"${busy}>Send reset email</button></form><p class="fine"><button class="link" data-act="amode" data-mode="signin">Back to sign in</button></p>`;
    else b=`<h3>Sign in</h3><form class="form" data-form="signin"><label for="f-email">Email</label><input id="f-email" value="${esc((sh.vals||{})["f-email"]||"")}" type="email" autocomplete="email" required><label for="f-pass">Password</label><input id="f-pass" value="${esc((sh.vals||{})["f-pass"]||"")}" type="password" autocomplete="current-password" required>${err}<button class="btn primary"${busy}>Sign in</button></form><p class="fine">New here? <button class="link" data-act="amode" data-mode="signup">Create an account</button> · <button class="link" data-act="amode" data-mode="reset">Forgot password</button></p><p class="fine">Tests already on this phone move into your account when you sign in.</p>`;
    return `<div class="scrim" data-act="cancel"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Account">${b}</div>`;
  }
  if(sh.kind==='pic'){
    const canShare=sh.file&&navigator.canShare&&navigator.canShare({ files:[sh.file] });
    return `<div class="scrim" data-act="closepic"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Result picture"><h3>Result picture</h3><div class="form"><label for="pic-name">Name on the picture</label><input id="pic-name" data-chg="picname" value="${esc(picName())}" placeholder="Your name" maxlength="40" autocomplete="name"></div>${sh.busy?'<p class="fine">Making the picture...</p>':`<img class="pic" src="${sh.url}" alt="Picture of this result"><div class="actions">${canShare?'<button class="btn primary" data-act="sharepic">Share or save...</button><p class="fine">Pick WhatsApp, Messages and so on, or Save Image to put it in your Photos.</p>':`<a class="btn primary file-btn" href="${sh.url}" download="${esc(sh.name)}">Save picture</a><p class="fine">Or press and hold the picture to save it.</p>`}<button class="btn ghost" data-act="closepic">Close</button></div>`}</div>`;
  }
  if(sh.kind==='share'){
    const s=sess(S.view.id), names=s.sharedWith||[], err=sh.err?`<p class="err" role="alert">${esc(sh.err)}</p>`:'';
    return `<div class="scrim" data-act="cancel"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Share"><h3>Share this test</h3><p class="fine">They see this test in full, with every drill, time and note. They do not see your other tests, your best or your history.</p><form class="form" data-form="share"><label for="f-share">Email or nickname</label><div class="inrow"><input id="f-share" value="${esc((sh.vals||{})["f-share"]||"")}" autocapitalize="off" autocomplete="off" required><button class="btn primary"${sh.busy?' disabled':''}>Share</button></div>${err}</form>${names.length?`<ul class="shared-list">${names.map(u=>`<li><span>${esc((s.sharedNames||{})[u]||'someone')}</span><button class="link danger" data-act="unshare" data-uid="${esc(u)}">Stop sharing</button></li>`).join('')}</ul>`:''}<div class="actions"><button class="btn ghost" data-act="cancel">Done</button></div></div>`;
  }
  if(sh.kind==='backup'){ const n=S.sessions.filter(hasData).length;
    return `<div class="scrim" data-act="cancel"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Backup"><h3>Backup and restore</h3><p>Your scores are stored on this phone. Save a backup file now and then (to Files, iCloud Drive or mail it to yourself), and restore it here on a new phone.</p><p class="fine">${n} test${n===1?'':'s'} on this phone. Last backup: ${S.prefs.lastBackup?fmtDate(S.prefs.lastBackup):'never'}.</p><div class="actions"><button class="btn primary" data-act="bk-save"${n?'':' disabled'}>Save backup file</button><label class="btn file-btn" for="bk-file">Restore from a backup file</label><input type="file" id="bk-file" accept=".json,application/json" hidden><button class="btn ghost" data-act="cancel">Close</button></div></div>`; }
  return `<div class="scrim" data-act="cancel"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(sh.title)}"><h3>${esc(sh.title)}</h3><p>${esc(sh.text)}</p><div class="actions"><button class="btn danger-solid" data-act="${sh.act}">${esc(sh.ok)}</button><button class="btn" data-act="cancel">Keep it</button></div></div>`; }

function summaryText(s){ const t=testById(s.test), c=calcOf(s);
  if(isB(t)){ const tt=tTotal(s,t); return [`${t.name}, ${fmtDate(s.date)}`, `Errors ${c.errors}, ghost ${c.total} of 150${tt?`, time ${fmtT(tt)}`:''}`, ...c.cats.map((x,i)=>`${i+1}. ${x.cat.name}: ${x.entered?x.pts:'not scored'}${x.cat.timed&&tOf(s,x.cat.id)?` (${fmtT(tOf(s,x.cat.id))})`:''}`)].join('\n'); }
  return [`${t.name}, ${fmtDate(s.date)}`, t.mode==='sum'?`Total ${c.total} (target ${t.targetTotal}, ceiling ${c.maxTotal})`:`Average ${c.total} percent`, ...c.cats.map((x,i)=>`${i+1}. ${x.cat.name}: ${x.entered?x.pts:'not scored'}`)].join('\n'); }

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, v=S.view, s=v.id?sess(v.id):null;
  if(a==='tab') go({ name:b.dataset.v });
  else if(a==='start'){ const n=newSession(b.dataset.test); go({ name:'session', id:n.id }); }
  else if(a==='open') go({ name:'session', id:b.dataset.id });
  else if(a==='result') go({ name:'result', id:b.dataset.id });
  else if(a==='drill') go({ name:'drill', id:v.id, ci:+b.dataset.ci, pi:0, from:v.name });
  else if(a==='part'){ v.pi=+b.dataset.pi; render(true); }
  else if(a==='set'){ const k=b.dataset.key, val=+b.dataset.val; if(s.scores[k]===val) delete s.scores[k]; else s.scores[k]=val; if(s.finished&&!hasData(s)) s.finished=false; touch(s); render(true); }
  else if(a==='step'){ const k=b.dataset.key, cur=typeof s.scores[k]==='number'?s.scores[k]:0; s.scores[k]=Math.max(0,cur+(+b.dataset.d)); touch(s); render(true); }
  else if(a==='clr'){ delete s.scores[b.dataset.key]; touch(s); render(true); }
  else if(a==='t-start'){ const cid=testById(s.test).cats[v.ci].id; stopTimer(s); s.timer={ cat:cid, start:Date.now() }; touch(s); render(true); }
  else if(a==='t-stop'){ stopTimer(s); touch(s); render(true); }
  else if(a==='t-reset'){ const cid=testById(s.test).cats[v.ci].id; if(s.times) delete s.times[cid]; touch(s); render(true); }
  else if(a==='zoomfig'){ S.zoom={ id:b.dataset.d, k:1 }; render(true); }
  else if(a==='zclose'){ S.zoom=null; render(true); }
  else if(a==='mirror'){ S.prefs.mirror=!S.prefs.mirror; persist(); render(true); }
  else if(a==='list') go({ name:'session', id:v.id });
  else if(a==='prev'||a==='next'){ const t=testById(s.test), d=a==='next'?1:-1; let ci=v.ci, pi=(v.pi||0)+d;
    if(pi<0){ ci--; if(ci<0) return; pi=t.cats[ci].parts.length-1; } else if(pi>=t.cats[ci].parts.length){ ci++; pi=0; }
    if(ci>=t.cats.length){ s.finished=true; touch(s); go({ name:'result', id:s.id }); } else go({ name:'drill', id:v.id, ci, pi, from:v.from }); }
  else if(a==='finish'){ s.finished=true; touch(s); go({ name:'result', id:s.id }); }
  else if(a==='edit') go({ name:'session', id:v.id });
  else if(a==='back'&&v.name==='shared') go({ name:'history', tab:'shared' });
  else if(a==='back'){ if(v.name==='drill') go(v.from==='result'?{ name:'result', id:v.id }:{ name:'session', id:v.id }); else if(v.name==='result') go({ name:'history' }); else go({ name:'home' }); }
  else if(a==='instest'){ v.test=b.dataset.test; render(true); }
  else if(a==='askdel'){ S.sheet={ title:'Delete this test?', text:'Its scores and notes are removed from your history. This cannot be undone.', ok:'Delete', act:'del' }; render(true); }
  else if(a==='cancel'){ S.sheet=null; render(true); }
  else if(a==='backup'){ S.sheet={ kind:'backup' }; render(true); }
  else if(a==='about'){ S.sheet={ kind:'about' }; render(true); }
  else if(a==='account'){ S.sheet={ kind:'account', mode:me()?'profile':'signin' }; render(true); }
  else if(a==='amode'){ S.sheet={ kind:'account', mode:b.dataset.mode }; render(true); }
  else if(a==='signout'){ S.sheet.busy=true; render(true); flush().finally(()=>C().signOut().then(()=>{ S.sessions=[]; S.tomb=[]; S.prefs.dirty=[]; S.prefs.owner=null; S.shared=null; persist(); S.sheet=null; go({ name:'home' }); toast('Signed out'); })); }
  else if(a==='share'){ if(!me()){ S.sheet={ kind:'account', mode:'signin' }; } else S.sheet={ kind:'share' }; render(true); }
  else if(a==='unshare'){ const u=b.dataset.uid; s.sharedWith=(s.sharedWith||[]).filter(x=>x!==u); if(s.sharedNames) delete s.sharedNames[u]; touch(s); flush(); render(true); }
  else if(a==='htab'){ v.tab=b.dataset.tab; if(v.tab==='shared') S.shared=null; render(true); }
  else if(a==='reshared'){ S.shared=null; S.sharedState=null; render(true); }
  else if(a==='openshared') go({ name:'shared', key:b.dataset.key });
  else if(a==='bk-save') saveBackup();
  else if(a==='del'){ removeSession(v.id); go({ name:'history' }); toast('Test deleted'); }
  else if(a==='pic') openPicture(s);
  else if(a==='sharepic'){ const f=S.sheet&&S.sheet.file; if(f){ navigator.share({ files:[f] }).catch(err=>{ if(!err||err.name!=='AbortError') toast('Sharing did not work. Press and hold the picture instead.'); }); } }
  else if(a==='closepic'){ S.sheet=null; render(true); }
  else if(a==='copy'){ const txt=summaryText(s); try{ navigator.clipboard.writeText(txt).then(()=>toast('Summary copied'),()=>toast('Copy was blocked by the browser')); }catch(err){ toast('Copy was blocked by the browser'); } }
});
document.addEventListener('change',e=>{ if(e.target.dataset.chg==='picname'){ S.prefs.picName=e.target.value; persist(); const s=sess(S.view.id); if(s) openPicture(s); return; }
  if(e.target.id==='bk-file'&&e.target.files&&e.target.files[0]){ const f=e.target.files[0]; f.text().then(t=>{ const r=mergeBackup(t); S.sheet=null; if(r.error) toast(r.error); else { toast(r.added||r.updated?`Restored ${r.added} new, ${r.updated} updated`:'Nothing new in that backup'); } render(true); }); return; }
  if(e.target.dataset.chg==='date'&&e.target.value){ const s=sess(S.view.id); s.date=e.target.value; touch(s); }
  if(e.target.dataset.chg==='tmm'){ const s=sess(S.view.id), cid=testById(s.test).cats[S.view.ci].id, m=document.getElementById('tmin').value.trim(), sc=document.getElementById('tsec').value.trim(); s.times=s.times||{};
    if(!m&&!sc) delete s.times[cid]; else { const mi=parseInt(m||'0',10), se=parseInt(sc||'0',10); if(isNaN(mi)||isNaN(se)||se>59){ toast('Seconds go from 0 to 59'); return; } s.times[cid]=mi*60+se; } touch(s); const tv=document.getElementById('tval'); if(tv) tv.textContent=fmtT(tOf(s,cid)); return; }
  if(e.target.dataset.chg==='time'){ const s=sess(S.view.id), cid=testById(s.test).cats[S.view.ci].id, v=e.target.value.trim(); s.times=s.times||{}; if(!v) delete s.times[cid]; else { const sec=parseT(v); if(sec==null){ toast('Type the time as minutes:seconds, like 8:43'); return; } s.times[cid]=sec; } touch(s); render(true); } });

document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  const kind=f.dataset.form, c=C(); if(!c) return;
  const sh=S.sheet, vals={}; f.querySelectorAll('input').forEach(i=>{ vals[i.id]=i.value; }); const val=id=>vals[id]||'';
  sh.vals=vals; sh.err=''; sh.ok=''; sh.busy=true; render(true);
  try{
    if(kind==='signin'){ await c.signIn(val('f-email'),val('f-pass')); S.sheet=null; toast('Signed in'); }
    else if(kind==='signup'){ await c.signUp(val('f-nick'),val('f-email'),val('f-pass'),val('f-name')); S.sheet=null; toast('Account created'); }
    else if(kind==='setname'){ await c.setName(val('f-name')); S.sessions.filter(hasData).forEach(s=>queueSync(s.id)); sh.ok='Name saved.'; }
    else if(kind==='reset'){ await c.reset(val('f-email')); sh.ok='If that email has an account, a reset link is on its way.'; }
    else if(kind==='share'){
      const q=val('f-share'), s=sess(S.view.id), who=await c.lookup(q);
      if(!who) sh.err='No account with that email or nickname.';
      else if(who.uid===me().uid) sh.err='That is you.';
      else if((s.sharedWith||[]).includes(who.uid)) sh.err=`Already shared with ${who.nick}.`;
      else { s.sharedWith=[...(s.sharedWith||[]),who.uid]; s.sharedNames=Object.assign({},s.sharedNames,{ [who.uid]:who.nick }); touch(s); await flush(); sh.vals={}; toast(`Shared with ${who.nick}`); }
    }
  }catch(err){ sh.err=kind==='share'?'Could not share. Check your connection and try again.':authMsg(err); }
  if(S.sheet===sh){ sh.busy=false; } render(true);
});
let noteT; document.addEventListener('input',e=>{ if(e.target.dataset.inp==='note'){ const s=sess(S.view.id), t=testById(s.test), cat=t.cats[S.view.ci], val=e.target.value; clearTimeout(noteT); noteT=setTimeout(()=>{ if(val.trim()) s.notes[cat.id]=val; else delete s.notes[cat.id]; touch(s); },500); } });
window.addEventListener('hashchange',()=>{ const n=location.hash.slice(1); if(['home','history','insights'].includes(n)&&S.view.name!==n&&['home','history','insights'].includes(S.view.name)) go({ name:n }); });

load();
if(!S.prefs.migWarmup){ S.sessions.forEach(s=>{ if(s.test==='basis'&&typeof s.scores['b1.a.0']==='number'&&typeof s.scores['b1.a.1']!=='number'){ s.scores['b1.a.1']=0; s.updatedAt=Date.now(); } }); S.prefs.migWarmup=true; persist(); }
{ const n=location.hash.slice(1); S.view={ name:['history','insights'].includes(n)?n:'home' }; }
render();
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.zoom){ S.zoom=null; render(true); } });
</script>
